name: jb_best_logistics_mobile
description: "Official Mobile Companion for JB & BEST LOGISTICS LLC"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.0.1

  # Networking & Serialization
  dio: ^5.4.3+1
  json_annotation: ^4.9.0

  # Secure Storage & Persistence
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Hardware & Scanner
  mobile_scanner: ^5.1.1
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0

  # UI & Media
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.6
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
